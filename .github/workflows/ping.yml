name: Ping Websites

on:
  schedule:
    # IST 11:00 AM - 6:00 PM = UTC 05:30 - 12:30 (Mon-Fri)
    - cron: '30-55/5 3 * * 1-5'    # 9:00 - 9:25 AM IST
    - cron: '*/5 4-12 * * 1-5'     # 9:30 AM - 6:25 PM IST
    - cron: '0-30/5 13 * * 1-5'    # 6:30 - 7:00 PM IST
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping sites
        run: |
          fail=0
          for url in \
            "https://medguide-ai-6orj.onrender.com" \
            "https://tripmakerai-a-multi-agent-travel-planner.onrender.com" \
            "https://cloudopsllm.onrender.com"
          do
            if curl -fsS -o /dev/null --max-time 90 --retry 1 "$url"; then
              echo "$url OK"
            else
              echo "$url DOWN"
              fail=1
            fi
          done
          exit $fail
