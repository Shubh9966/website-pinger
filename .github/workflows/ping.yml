name: Ping Websites

on:
  schedule:
    # IST 11:00 AM - 6:00 PM = UTC 05:30 - 12:30 (Mon-Fri)
    - cron: '30-55/5 5 * * 1-5'
    - cron: '*/5 6-11 * * 1-5'
    - cron: '0-30/5 12 * * 1-5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping sites
        run: |
          fail=0
          for url in \
            "https://medguide-ai-6orj.onrender.com/health" \
            "https://tripmakerai-a-multi-agent-travel-planner.onrender.com/health" \
            "https://cloudopsllm.onrender.com/health"
          do
            if curl -fsS -o /dev/null --max-time 90 --retry 1 "$url"; then
              echo "$url OK"
            else
              echo "$url DOWN"
              fail=1
            fi
          done
          exit $fail
